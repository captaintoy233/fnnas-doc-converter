# DocConverter + WeKnora 全栈部署（一体式演示/小规模环境）
# 使用: docker compose up -d
# 配置环境变量: .env 文件或直接在 shell 中 export
#
# 若你已有独立的 WeKnora 部署（推荐生产方式），请改用 docker-compose.standalone.yml

networks:
  docnet:
    driver: bridge

services:
  # ── 格式转换器 ──
  converter:
    build:
      context: ./app/server
      dockerfile: Dockerfile
    image: docconverter:2.1.1
    container_name: doc-converter
    ports:
      - "${CONVERTER_PORT:-8080}:8080"
    environment:
      # 配置覆盖 (通过环境变量)
      WEKNORA_URL: "${WEKNORA_URL:-http://weknora-app:18080}"
      WEKNORA_ENABLED: "${WEKNORA_ENABLED:-true}"
      WEKNORA_AUTO_PUSH: "${WEKNORA_AUTO_PUSH:-true}"
      WEKNORA_DATASET_ID: "${WEKNORA_DATASET_ID:-}"
      WEKNORA_API_KEY: "${WEKNORA_API_KEY:-}"
      WEKNORA_EMAIL: "${WEKNORA_EMAIL:-}"
      WEKNORA_PASSWORD: "${WEKNORA_PASSWORD:-}"
      WEKNORA_PUSH_ORIGINAL: "${WEKNORA_PUSH_ORIGINAL:-true}"
      WEKNORA_PUSH_REL_TITLE: "${WEKNORA_PUSH_REL_TITLE:-true}"
      BATCH_WORKERS: "${BATCH_WORKERS:-4}"
      CONVERTER_SOURCE_DIR: "${CONVERTER_SOURCE_DIR:-/data/input}"
      CONVERTER_OUTPUT_DIR: "/data/output"
      CONVERTER_REGISTRY_PATH: "/data/state/registry.json"
      CONVERTER_WATCH_ENABLED: "${CONVERTER_WATCH_ENABLED:-false}"
    volumes:
      - input_data:/data/input        # 源文件放入此目录
      - output_data:/data/output      # 转换结果输出到此目录
      - upload_data:/data/uploads     # 上传临时文件
      - state_data:/data/state        # 增量同步注册表
    networks:
      - docnet
    restart: unless-stopped
    depends_on:
      weknora-app:
        condition: service_started

  # ── WeKnora 知识库平台 ──
  weknora-app:
    image: hub.1panel.dev/wechatopenai/weknora-app:latest
    container_name: weknora-app
    ports:
      - "${WEKNORA_APP_PORT:-18080}:18080"
    environment:
      SYSTEM_AES_KEY: "${SYSTEM_AES_KEY:-}"
      TENANT_AES_KEY: "${TENANT_AES_KEY:-}"
      LARGE_LANGUAGE_MODEL_TYPE: "${LLM_TYPE:-ollama}"
      LARGE_LANGUAGE_MODEL_HOST: "${LLM_HOST:-host.docker.internal:11434}"
    volumes:
      - weknora_app_data:/app/data
      - weknora_plugins:/app/plugins
    networks:
      - docnet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  weknora-docreader:
    image: hub.1panel.dev/wechatopenai/weknora-docreader:latest
    container_name: weknora-docreader
    networks:
      - docnet
    restart: unless-stopped

  weknora-frontend:
    image: hub.1panel.dev/wechatopenai/weknora-ui:latest
    container_name: weknora-frontend
    ports:
      - "${WEKNORA_UI_PORT:-18081}:80"
    environment:
      API_URL: "http://weknora-app:18080"
    networks:
      - docnet
    restart: unless-stopped

  # ── 基础设施 ──
  postgres:
    image: hub.1panel.dev/paradedb/paradedb:v0.22.2-pg17
    container_name: weknora-pg
    environment:
      POSTGRES_DB: weknora
      POSTGRES_USER: weknora
      POSTGRES_PASSWORD: "${PG_PASSWORD:?请在 .env 设置 PG_PASSWORD（Postgres 口令）}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - docnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weknora"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: hub.1panel.dev/library/redis:7.0-alpine
    container_name: weknora-redis
    command: redis-server --requirepass "${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD（Redis 口令）}"
    volumes:
      - redis_data:/data
    networks:
      - docnet
    restart: unless-stopped

  minio:
    image: hub.1panel.dev/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: weknora-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:?请在 .env 设置 MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?请在 .env 设置 MINIO_PASSWORD}"
    # MinIO 仅内部网络使用，不暴露宿主端口（避免公网直连）
    volumes:
      - minio_data:/data
    networks:
      - docnet
    restart: unless-stopped

volumes:
  input_data:
  output_data:
  upload_data:
  state_data:
  pg_data:
  redis_data:
  minio_data:
  weknora_app_data:
  weknora_plugins:
